analysis:
  calculate_statistics: true
  create_plots: false
  generate_summary: true
execution:
  algorithms:
  - description: Path-Based MILP Formulation
    executable_path: build/executables/path_based_formulation
    name: path_based_formulation
  - description: Flow-Based MILP Formulation
    executable_path: build/executables/flow_based_formulation
    name: flow_based_formulation
  heuristics_level: 0.5
  time_limit: 60
  time_limits_by_group:
    ocstpin: 30
    orst: 60
experiment:
  algorithm: Comparative Analysis
  description: Comprehensive comparison of all available formulations on small-medium
    instances
  name: comparative_formulations
  version: '1.0'
instances:
  groups:
  - description: OCST instances (small-medium)
    name: ocstpin
    pattern: ocstpin*
  - description: ORST instances (small-medium)
    name: orst
    pattern: orst[0-9]
  input_directory: data/input/test_instances
  output_directory: data/output/test_instances
logging:
  level: INFO
  log_filename: experiment_{timestamp}.log
  log_to_file: true
output:
  columns:
  - instance_name
  - instance_group
  - algorithm_name
  - algorithm_description
  - num_nodes
  - num_edges
  - num_requirements
  - probability
  - optimal_known
  - best_found
  - is_optimal
  - runtime_seconds
  - nodes_explored
  - mip_gap_percent
  - gurobi_status
  - time_limit
  - heuristics_level
  - algorithm_version
  csv_filename_template: experimento_{algorithm}_{timestamp}.csv
  results_directory: experiments/results
