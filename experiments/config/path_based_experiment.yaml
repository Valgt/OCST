analysis:
  calculate_statistics: true
  create_plots: false
  generate_summary: true
execution:
  executable_path: build/executables/path_based_formulation
  heuristics_level: 0.5
  time_limit: 60
experiment:
  algorithm: Path-Based MILP Formulation
  description: Comprehensive evaluation of path-based formulation on all available
    instances
  name: path_based_formulation
  version: '1.0'
instances:
  groups:
  - description: OCST instances (small-medium)
    name: ocstpin
    pattern: ocstpin*
  - description: ORST instances (medium - excluding Big)
    name: orst
    pattern: orst[0-9]
  input_directory: data/input/test_instances
  output_directory: data/output/test_instances
logging:
  level: INFO
  log_filename: experiment_{timestamp}.log
  log_to_file: true
output:
  columns:
  - instance_name
  - instance_group
  - num_nodes
  - num_edges
  - num_requirements
  - probability
  - optimal_known
  - best_found
  - is_optimal
  - runtime_seconds
  - nodes_explored
  - mip_gap_percent
  - gurobi_status
  - time_limit
  - heuristics_level
  - algorithm_version
  csv_filename_template: experimento_{algorithm}_{timestamp}.csv
  results_directory: experiments/results
