# Rooted Tree-Based Formulation Experiment Configuration

algorithm:
  name: "rooted_tree_based_formulation"
  description: "Rooted Tree-Based MILP Formulation"
  executable: "build/executables/rooted_tree_based_formulation"
  version: "1.0"
  time_limit: 30
  heuristics: 0.05

instances:
  input_directory: "data/input/test_instances"
  groups:
    - name: "ocstpin"
      pattern: "ocstpin*"
      description: "OCST instances (small-medium)"
    - name: "orst"
      pattern: "orst[0-9]"
      description: "ORST instances (small-medium)"

output:
  results_directory: "experiments/results"
  csv_file: "experiments/results/experimento_rooted_tree_based_formulation_{timestamp}.csv"

logging:
  level: "INFO"
  log_to_file: true

